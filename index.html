<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>La Taberna del Amigo Invisible v0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#17151e;color:#f6e4bd;font:15px system-ui;text-align:center}h1{font-size:19px;margin:12px}button,select{background:#45354a;color:#fff0d4;border:2px solid #b18b58;border-radius:8px;padding:10px;font:inherit}button:active{background:#765477}#game{display:block;margin:auto;width:min(96vw,900px);height:auto;image-rendering:pixelated;border:4px solid #ab8150;touch-action:none}#info{max-width:900px;margin:8px auto;min-height:62px;background:#28202c;border:2px solid #876b4d;border-radius:8px;padding:10px;text-align:left}#team{font-size:13px;color:#ebc68b}#pad{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px}#pad button{min-width:59px;min-height:55px;touch-action:none}#pad .stack{display:flex;flex-direction:column;gap:3px}#talk{background:#6b5035}#overlay{position:fixed;inset:0;background:#100d18ed;display:grid;place-items:center;z-index:5;padding:15px}#panel{width:min(430px,100%);background:#302533;border:3px solid #b28b57;border-radius:15px;padding:22px}#panel select,#panel button{width:100%;margin:10px 0}#modal{display:none;position:fixed;inset:0;background:#09070bd9;z-index:8;align-items:center;justify-content:center;padding:12px}#dialogbox{width:min(450px,100%);background:#302533;border:3px solid #b28b57;border-radius:12px;padding:20px;text-align:left}#dialogbox button{margin:6px}small{color:#bfb1a2}body:not(.started) #game,body:not(.started) #pad,body:not(.started) #info{visibility:hidden}</style></head><body><div id="overlay"><div id="panel"><h2>🍺 La Taberna del Amigo Invisible</h2><p>Elige a tu aventurero</p><select id="pick"></select><button id="start">⚔ Entrar en la taberna</button><small>Versión 0.3 · 18 aventureros y Pere como tabernero</small></div></div><h1>🍺 La Taberna del Amigo Invisible <small>v0.3</small></h1><div id="info"><div id="message">Explora la taberna, habla con tus amigos y recluta dos compañeros.</div><div id="team"></div></div><canvas id="game" width="896" height="608"></canvas><div id="pad"><button data-dir="left">◀</button><div class="stack"><button data-dir="up">▲</button><button data-dir="down">▼</button></div><button data-dir="right">▶</button><button id="talk">💬 Hablar</button></div><small>WASD o flechas · E para hablar · Mueve el dedo sobre el mapa o usa los controles</small><div id="modal"><div id="dialogbox"><h2 id="npcTitle"></h2><p id="npcLine"></p><p id="npcDetail"></p><div id="actions"></div></div></div><script>
'use strict';const data=[
['David','Mago','Me han vuelto a banear el chat del LoL por decir barbaridades','El que se mueva es gay'],['Noelia','Pícaro','Amor, pásame mi mechero. ¿Me pones una pinta de lager?','Kaladin y Shallan'],['Jordux','Bárbaro','Otra pausa dramática...','FF al 15'],['Pablo','Arquero','Me voy al estudio','Hay que jugar en Faceit'],['Villa','Guerrero','¿Sale CS?','Gomu Gomu Gatling'],['Jesús','Pícaro','Echo de menos trabajar','El café de mi casa es el mejor'],['Carlos','Clérigo','Putos cines ABC','Bisexualidad legendaria'],['Lucía','Arquero','¿Me pones un zumo de piña?','The Fate of Ophelia'],['Manu','Bárbaro','Ñas, ¿sale lolsito chavales? Qué hambre tengo.','Golpetazo con tubería de PVC'],['María','Clérigo','Tú, chavales, ¿jugamos al Gang Beasts?','¡MANUEL!'],['Martín','Guerrero','¿Dos doses o dos doses?','FP de jardinería'],['Juan','Mago','A ver, en verdad, pues sí...','Vamos a mirarnos a nosotros primero'],['Fran','Pícaro','Nah, estás completamente basado. ¿Descendemos al averno?','Ligarse a la camarera'],['Óscar','Mago','Yo juego eminencias, pero que no están chetas','Yo juego eminencias'],['Lobato','Guerrero','Star Wars, la puta mejor saga del mundo','Prevención de riesgos laborales'],['Guarriadna','Pícaro','Buah, yo he sido una maleanta de cuidado','Contabilidad fatal'],['Ari','Arquero','En Venezuela sí ponen Los Simpsons, y tenemos televisores','Panchitada histórica'],['Alba','Clérigo','¿Sale piti? Juan moment','Besito en la frente']];
const colors={'Mago':'#9a7be2','Pícaro':'#c7a85a','Bárbaro':'#d07160','Arquero':'#67ae86','Guerrero':'#6793c8','Clérigo':'#dfc5a1'};const positions=[[94,178],[210,178],[335,178],[455,178],[575,178],[695,178],[95,333],[212,333],[337,333],[457,333],[575,333],[695,333],[96,480],[210,480],[335,480],[455,480],[575,480],[696,480]];let hero=0,party=[],player={x:450,y:552},last=[{x:450,y:552}],modal=false,started=false,pressed=new Set(),tick=0;const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const $=id=>document.getElementById(id);data.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p[0]+' — '+p[1];$('pick').appendChild(o)});function block(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function text(s,x,y,color='#fff0d2',size=12){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.fillText(s,x,y)}function furniture(){block(0,0,896,608,'#51372d');for(let y=12;y<608;y+=24){block(0,y,896,2,'#654735');for(let x=(y%48)*3;x<896;x+=115)block(x,y+4,2,18,'#463127')}block(0,0,896,110,'#282630');block(15,17,505,73,'#765034');block(20,22,495,56,'#b3834d');for(let x=35;x<510;x+=60)block(x,65,45,6,'#6d452d');text('LA BARRA DE PERE',255,51,'#3b2723',19);block(718,10,156,86,'#40343a');block(729,22,135,62,'#8a5140');block(758,35,78,44,'#ef993b');block(773,48,48,31,'#ffd273');text('CHIMENEA',796,104,'#e7bd82');for(let row=0;row<2;row++)for(let col=0;col<3;col++){let x=154+col*266,y=253+row*165;block(x-54,y-29,108,58,'#382a2d');block(x-49,y-24,98,48,'#95623e');block(x-44,y-19,88,38,'#b7834b');block(x-36,y-31,26,8,'#61504a');block(x+14,y+23,26,8,'#61504a');block(x-7,y-7,14,14,'#dbbd77')}block(770,515,110,74,'#42352d');block(782,523,87,54,'#6e5842');text('⚔',825,549,'#f5cf77',20);text('MAZMORRA',825,568,'#f6ddaa',11);block(418,593,65,15,'#2c2627');text('ENTRADA',449,590,'#fff1bc',11)}function sprite(x,y,cls,name,main=false){const c=colors[cls]||'#ab7854';block(x-10,y-23,20,17,'#e7b892');block(x-11,y-27,22,7,main?'#f4d26a':'#453038');block(x-12,y-6,24,22,c);block(x-9,y+15,8,9,'#292432');block(x+2,y+15,8,9,'#292432');block(x-6,y-16,3,3,'#292432');block(x+4,y-16,3,3,'#292432');text(name,x,y-33,main?'#ffe070':'#f8edcf',11)}function collides(x,y){if(x<22||x>874||y<121||y>575)return true;for(let row=0;row<2;row++)for(let col=0;col<3;col++){let a=154+col*266,b=253+row*165;if(Math.abs(x-a)<69&&Math.abs(y-b)<47)return true}if(x>760&&y>504)return true;return false}function render(){furniture();data.forEach((p,i)=>{if(i===hero||party.includes(i))return;let [x,y]=positions[i];sprite(x,y,p[1],p[0])});sprite(562,105,'Guerrero','Pere 🍺');party.forEach((idx,i)=>{const target=last[Math.min(last.length-1,Math.round((i+1)*13))]||player;sprite(target.x,target.y,data[idx][1],data[idx][0])});sprite(player.x,player.y,data[hero][1],data[hero][0]+' (TÚ)',true);if(started&&!modal){let speed=2.6,dx=0,dy=0;if(pressed.has('left'))dx--;if(pressed.has('right'))dx++;if(pressed.has('up'))dy--;if(pressed.has('down'))dy++;if(dx||dy){let len=Math.hypot(dx,dy);dx=dx/len*speed;dy=dy/len*speed;let nx=player.x+dx,ny=player.y+dy;if(!collides(nx,player.y))player.x=nx;if(!collides(player.x,ny))player.y=ny;last.unshift({...player});if(last.length>50)last.pop()}}requestAnimationFrame(render)}function nearest(){let list=data.map((p,i)=>({i,x:positions[i][0],y:positions[i][1],name:p[0]})).filter(n=>n.i!==hero&&!party.includes(n.i));list.push({i:-1,x:562,y:130,name:'Pere'});return list.map(n=>({...n,d:Math.hypot(n.x-player.x,n.y-player.y)})).sort((a,b)=>a.d-b.d)[0]}function action(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;$('actions').appendChild(b)}function close(){modal=false;$('modal').style.display='none'}function update(){ $('team').textContent='⚔ Equipo: '+data[hero][0]+' · '+party.map(i=>data[i][0]).join(' · ')+(party.length===2?' · ¡Listo!':' · '+(2-party.length)+' huecos libres') }function talk(){if(!started||modal)return;const n=nearest();if(!n||n.d>76){$('message').textContent='Acércate a alguien para hablar (distancia corta).';return}modal=true;$('modal').style.display='flex';$('actions').replaceChildren();if(n.i===-1){$('npcTitle').textContent='🍺 Pere · Tabernero';$('npcLine').textContent='«Bienvenidos a mi taberna, panchitos. ¡Hoy es mi día libre!»';$('npcDetail').textContent=party.length===2?'Ya tienes un equipo completo. La mazmorra llegará en la siguiente versión.':'Busca dos compañeros antes de partir a la mazmorra.';action('Cerrar',close);return}const p=data[n.i];$('npcTitle').textContent=p[0]+' · '+p[1];$('npcLine').textContent='«'+p[2]+'»';$('npcDetail').textContent='Habilidad especial: '+p[3];if(party.length<2)action('➕ Reclutar',()=>{party.push(n.i);update();$('message').textContent=p[0]+' se une a tu equipo.';close()});else $('npcDetail').textContent+=' · Tu equipo ya está completo.';action('Cerrar',close)}$('talk').onclick=talk;$('start').onclick=()=>{hero=Number($('pick').value);party=[];player={x:449,y:552};last=[{...player}];started=true;document.body.classList.add('started');$('overlay').style.display='none';update();$('message').textContent='¡Bienvenido, '+data[hero][0]+'! Habla con tus amigos y recluta a dos.'};document.addEventListener('keydown',e=>{const m={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};if(m[e.key]){e.preventDefault();pressed.add(m[e.key])}if(e.key.toLowerCase()==='e'&&!e.repeat)talk();if(e.key==='Escape')close()});document.addEventListener('keyup',e=>{const m={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};if(m[e.key])pressed.delete(m[e.key])});document.querySelectorAll('[data-dir]').forEach(b=>{const dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pressed.add(dir)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>pressed.delete(dir))});canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*896/r.width,y=(e.clientY-r.top)*608/r.height;const dx=x-player.x,dy=y-player.y;if(Math.hypot(dx,dy)<95)talk()});window.addEventListener('blur',()=>pressed.clear());render();
</script></body></html>
